
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: eu-north-1
  EKS_CLUSTER: devops-mini

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::980819806634:role/devops-mini-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS Identity
        if: github.event_name == 'push'
        run: |
          aws sts get-caller-identity

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Show image name
        run: |
          echo "IMAGE=$IMAGE"

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" \
            ./app

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Run container
        run: |
          docker run -d \
            --name devops-mini-api \
            -p 3000:3000 \
            "$IMAGE:${GITHUB_SHA}"

      - name: Health check
        run: |
          sleep 2
          curl --fail http://localhost:3000/health

      - name: Configure kubectl
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Deploy to EKS
        if: github.event_name == 'push'
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/devops-mini-api \
            devops-mini-api="$IMAGE:${GITHUB_SHA}"

      - name: Wait for rollout
        if: github.event_name == 'push'
        run: |
          kubectl rollout status deployment/devops-mini-api --timeout=180s

      - name: Show deployment
        if: github.event_name == 'push'
        run: |
          kubectl get deployment devops-mini-api
          kubectl get pods -l app=devops-mini-api

